# 這個 crate 是 capstone 2 的 core logic — device 抽象 + 效果引擎。
# 真正的 Tauri 桌面 app 在 `src-tauri/` 子目錄，需要前端搭配，請見 README。

[package]
name = "rgb-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "rgb_core"
path = "src/lib.rs"

[[bin]]
name = "rgb-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
hidapi = "2"

[dev-dependencies]
tokio-test = "0.4"
