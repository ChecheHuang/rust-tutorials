[package]
name = "mini-rg"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mini-rg"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
ignore = "0.4"
crossbeam-channel = "0.5"
num_cpus = "1"
memchr = "2"
termcolor = "1"
atty = "0.2"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
