apiVersion: apps/v1
kind: Deployment
metadata:
  name: ch48
  labels: { app: ch48 }
spec:
  replicas: 3
  selector:
    matchLabels: { app: ch48 }
  template:
    metadata:
      labels: { app: ch48 }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: ghcr.io/your-org/ch48:latest
          ports:
            - containerPort: 8080
          env:
            - name: RUST_LOG
              value: info
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            initialDelaySeconds: 1
            periodSeconds: 2
            failureThreshold: 2
          # SIGTERM → graceful shutdown
          lifecycle:
            preStop:
              exec:
                # 給 service 一點時間把 IP 從 endpoint slice 移除
                command: ["/bin/sh", "-c", "sleep 5"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata: { name: ch48 }
spec:
  selector: { app: ch48 }
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: ch48 }
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ch48
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
